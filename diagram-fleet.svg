<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
<title id="t">Classes of robotic avatar in the Mars Avatar Project, version 3.6</title>
<desc id="d">Six classes of specialised platform — scientific rover, construction avatar, cargo robot, drone, laboratory unit and maintenance robot — coordinated by Mission Control acting as the fleet dispatcher. Links are drawn dashed because connectivity between platforms is intermittent.</desc>
<defs>
<style>
.b{fill:#0e1526;stroke:#2a3546;stroke-width:2}
.k{fill:#13294b;stroke:#3a6ea5;stroke-width:2.5}
.n{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.12em;fill:#ff6b35}
.c{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.12em;fill:#9aa7b8}
.h{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:22px;font-weight:600;fill:#eef1f5}
.p{font-family:Inter,system-ui,sans-serif;font-size:15px;fill:#9aa7b8}
.l{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.12em;fill:#5f6b7d}
.e{stroke:#2a3546;stroke-width:2;stroke-dasharray:6 6}
</style>
</defs>

<line class="e" x1="600" y1="337" x2="200" y2="106"/>
<line class="e" x1="600" y1="337" x2="600" y2="76"/>
<line class="e" x1="600" y1="337" x2="1000" y2="106"/>
<line class="e" x1="600" y1="337" x2="1000" y2="561"/>
<line class="e" x1="600" y1="337" x2="600" y2="591"/>
<line class="e" x1="600" y1="337" x2="200" y2="561"/>

<rect class="k" x="440" y="295" width="320" height="85" rx="10"/>
<text class="c" x="462" y="326">MISSION CONTROL · LAYER 03</text>
<text class="h" x="462" y="356">Mission AI</text>
<text class="p" x="608" y="356">fleet dispatch</text>

<rect class="b" x="60" y="60" width="280" height="92" rx="10"/>
<text class="n" x="80" y="88">01</text>
<text class="h" x="80" y="116">Scientific Rover</text>
<text class="p" x="80" y="138">drilling · sampling · spectra</text>

<rect class="b" x="460" y="30" width="280" height="92" rx="10"/>
<text class="n" x="480" y="58">02</text>
<text class="h" x="480" y="86">Construction Avatar</text>
<text class="p" x="480" y="108">panels · structures · sites</text>

<rect class="b" x="860" y="60" width="280" height="92" rx="10"/>
<text class="n" x="880" y="88">03</text>
<text class="h" x="880" y="116">Cargo Robot</text>
<text class="p" x="880" y="138">equipment · parts · samples</text>

<rect class="b" x="860" y="515" width="280" height="92" rx="10"/>
<text class="n" x="880" y="543">04</text>
<text class="h" x="880" y="571">Drone</text>
<text class="p" x="880" y="593">survey · mapping · inspection</text>

<rect class="b" x="460" y="545" width="280" height="92" rx="10"/>
<text class="n" x="480" y="573">05</text>
<text class="h" x="480" y="601">Laboratory Unit</text>
<text class="p" x="480" y="623">analysis · preparation · storage</text>

<rect class="b" x="60" y="515" width="280" height="92" rx="10"/>
<text class="n" x="80" y="543">06</text>
<text class="h" x="80" y="571">Maintenance Robot</text>
<text class="p" x="80" y="593">diagnostics · module swap</text>

<text class="l" x="60" y="665">DASHED LINKS — CONNECTIVITY BETWEEN PLATFORMS IS INTERMITTENT BY ASSUMPTION</text>
</svg>
