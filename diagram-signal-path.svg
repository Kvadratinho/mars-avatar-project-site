<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
<title id="t">Earth–Mars signal path</title>
<desc id="d">A command travels from Earth through an orbital relay to the robotic fleet on Mars. One-way light time is 4 to 22 minutes; a full command and response cycle takes 8 to 44 minutes. Real-time piloting is not possible.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff6b35"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3a6ea5"/></marker>
<style>
.h{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:26px;font-weight:600;fill:#eef1f5}
.n{font-family:"JetBrains Mono",monospace;font-size:16px;letter-spacing:.12em;fill:#ff6b35}
.c{font-family:"JetBrains Mono",monospace;font-size:16px;letter-spacing:.12em;fill:#3a6ea5}
.p{font-family:Inter,system-ui,sans-serif;font-size:17px;fill:#9aa7b8}
.l{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.12em;fill:#5f6b7d}
</style>
</defs>

<circle cx="170" cy="400" r="86" fill="#13294b" stroke="#3a6ea5" stroke-width="2.5"/>
<text class="h" x="170" y="530" text-anchor="middle">Earth</text>
<text class="p" x="170" y="558" text-anchor="middle">operator sets goals</text>

<circle cx="1030" cy="400" r="60" fill="#5c2a18" stroke="#c1440e" stroke-width="2.5"/>
<text class="h" x="1030" y="510" text-anchor="middle">Mars</text>
<text class="p" x="1030" y="538" text-anchor="middle">fleet executes</text>

<rect x="545" y="150" width="110" height="52" rx="8" fill="#0e1526" stroke="#2a3546" stroke-width="2"/>
<text class="l" x="600" y="182" text-anchor="middle">RELAY</text>

<path d="M256 372 Q 430 200 543 176" fill="none" stroke="#ff6b35" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#a)"/>
<path d="M657 176 Q 830 200 968 372" fill="none" stroke="#ff6b35" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#a)"/>
<text class="n" x="600" y="112" text-anchor="middle">COMMAND UPLINK · 4–22 MIN</text>

<path d="M972 440 Q 600 570 262 440" fill="none" stroke="#3a6ea5" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#b)"/>
<text class="c" x="600" y="620" text-anchor="middle">RESULT DOWNLINK · 4–22 MIN</text>

<text class="l" x="600" y="660" text-anchor="middle">FULL CYCLE 8–44 MIN — NO CONTROL LOOP CLOSES IN REAL TIME</text>
</svg>
